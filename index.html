<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩雨轩 - AI 产品经理</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #0a0a1a;
    --bg-card: rgba(255, 255, 255, 0.05);
    --border-glass: rgba(255, 255, 255, 0.12);
    --gradient-1: #a855f7;
    --gradient-2: #6366f1;
    --gradient-3: #06b6d4;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --glow-purple: rgba(168, 85, 247, 0.4);
    --glow-cyan: rgba(6, 182, 212, 0.4);
  }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== Canvas Background ===== */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== Main Content Wrapper ===== */
  .main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeInUp 0.8s ease-out;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Avatar ===== */
  .avatar-wrapper {
    position: relative;
    width: 140px;
    height: 140px;
    margin-bottom: 28px;
  }

  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2), var(--gradient-3));
    animation: rotateGradient 4s linear infinite;
    filter: blur(8px);
    opacity: 0.7;
  }

  @keyframes rotateGradient {
    0%   { filter: blur(8px) hue-rotate(0deg); }
    100% { filter: blur(8px) hue-rotate(360deg); }
  }

  .avatar-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.2);
    z-index: 1;
  }

  .avatar-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .avatar-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
    font-size: 56px;
    color: white;
  }

  /* ===== Name & Title ===== */
  .name {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #e2e8f0 0%, #c084fc 50%, #22d3ee 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .title {
    font-size: 1.05rem;
    color: var(--text-secondary);
    font-weight: 400;
    letter-spacing: 0.06em;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .title::before,
  .title::after {
    content: '';
    display: inline-block;
    width: 32px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gradient-3), transparent);
  }

  /* ===== Bio Card ===== */
  .card {
    width: 100%;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    border-radius: 16px;
    padding: 28px 30px;
    margin-bottom: 20px;
    position: relative;
    transition: all 0.3s ease;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 17px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(6,182,212,0.3));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(168, 85, 247, 0.12), 0 2px 8px rgba(6, 182, 212, 0.08);
  }

  .bio {
    font-size: 0.98rem;
    line-height: 1.8;
    color: var(--text-secondary);
    text-align: center;
  }

  .bio strong {
    color: var(--text-primary);
  }

  /* ===== Skills ===== */
  .section-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-secondary);
    margin-bottom: 14px;
    text-align: center;
  }

  .skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .skill-tag {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.88rem;
    font-weight: 500;
    color: #e2e8f0;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
    cursor: default;
  }

  .skill-tag:hover {
    background: rgba(168, 85, 247, 0.2);
    border-color: rgba(168, 85, 247, 0.5);
    box-shadow: 0 0 20px var(--glow-purple);
    transform: translateY(-2px);
  }

  .skill-tag:nth-child(3n):hover {
    background: rgba(6, 182, 212, 0.2);
    border-color: rgba(6, 182, 212, 0.5);
    box-shadow: 0 0 20px var(--glow-cyan);
  }

  .skill-tag:nth-child(3n+1):hover {
    background: rgba(99, 102, 241, 0.2);
    border-color: rgba(99, 102, 241, 0.5);
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
  }

  /* ===== Social Links ===== */
  .social-links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .social-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .social-btn:hover {
    color: #fff;
    border-color: rgba(168, 85, 247, 0.5);
    box-shadow: 0 0 24px var(--glow-purple);
    transform: translateY(-2px);
  }

  .social-btn:nth-child(2n):hover {
    border-color: rgba(6, 182, 212, 0.5);
    box-shadow: 0 0 24px var(--glow-cyan);
  }

  .social-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  /* ===== Footer ===== */
  .footer {
    position: relative;
    z-index: 1;
    padding: 24px 0 32px;
    font-size: 0.78rem;
    color: rgba(148, 163, 184, 0.5);
    text-align: center;
  }

  /* ===== Responsive ===== */

    .main { padding: 40px 16px 24px; }
    .name { font-size: 1.7rem; }
    .avatar-wrapper { width: 110px; height: 110px; }
    .card { padding: 20px; }
    .bio { font-size: 0.9rem; }
    .social-links { gap: 10px; }
    .social-btn { padding: 8px 16px; font-size: 0.82rem; }
  }
</style>

<!-- ===== Scripts ===== -->
<script>
// ===== 粒子背景 =====
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

let particles = [];
const PARTICLE_COUNT = 80;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor() {
    this.reset();
    // 初始随机散布在屏幕各处
    this.y = Math.random() * canvas.height;
  }

  reset() {
    this.x = Math.random() * canvas.width;
    this.y = -10;
    this.size = Math.random() * 2 + 0.5;
    this.speedY = Math.random() * 0.4 + 0.15;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.5 + 0.2;
    this.hue = Math.random() < 0.5
      ? Math.random() * 40 + 260   // 紫色系 260-300
      : Math.random() * 20 + 180;  // 青色系 180-200
  }

  update() {
    this.y += this.speedY;
    this.x += this.speedX;

    if (this.y > canvas.height + 10 || this.x < -10 || this.x > canvas.width + 10) {
      this.reset();
      this.y = -10;
    }
  }

  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 80%, 65%, ${this.opacity})`;
    ctx.fill();
  }
}

// 创建粒子
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

// 连线配置
const MAX_DIST = 120;

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 更新并绘制粒子
  for (const p of particles) {
    p.update();
    p.draw(ctx);
  }

  // 绘制连线
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < MAX_DIST) {
        const alpha = (1 - dist / MAX_DIST) * 0.15;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(168, 85, 247, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(animate);
}

animate();

// ===== 鼠标交互：鼠标附近的粒子会被轻微吸引 =====
let mouseX = -9999;
let mouseY = -9999;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// 扩展 particle 的 update，增加鼠标吸引
const originalUpdate = Particle.prototype.update;
Particle.prototype.update = function() {
  // 鼠标吸引
  const dx = mouseX - this.x;
  const dy = mouseY - this.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const INTERACT_RANGE = 150;

  if (dist < INTERACT_RANGE && dist > 0) {
    const force = (1 - dist / INTERACT_RANGE) * 0.03;
    this.x += dx * force;
    this.y += dy * force;
  }

  originalUpdate.call(this);
};
</script>
